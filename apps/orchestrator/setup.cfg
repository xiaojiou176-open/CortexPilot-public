[metadata]
name = codeflow-orchestrator
version = 0.1.0a4
description = Codeflow orchestrator and read-only MCP runtime
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
url = https://github.com/xiaojiou176-open/codeflow
project_urls =
    Homepage = https://xiaojiou176-open.github.io/codeflow/
    Repository = https://github.com/xiaojiou176-open/codeflow
    Documentation = https://xiaojiou176-open.github.io/codeflow/mcp/
    Issues = https://github.com/xiaojiou176-open/codeflow/issues
    Discussions = https://github.com/xiaojiou176-open/codeflow/discussions
    Changelog = https://github.com/xiaojiou176-open/codeflow/releases

[options]
package_dir =
    = src
packages = find:
install_requires =
    pydantic==2.13.0
    jsonschema==4.26.0
    typer==0.25.1
    rich==15.0.0
    fastapi==0.128.1
    uvicorn==0.44.0
    python-dotenv==1.2.2
    opentelemetry-api==1.41.0
    opentelemetry-sdk==1.41.0
    opentelemetry-exporter-otlp-proto-grpc==1.41.0
    opentelemetry-exporter-otlp-proto-http==1.41.0
    playwright==1.58.0
    google-genai==1.73.1
    openai-agents==0.13.6
    temporalio==1.22.0
    duckduckgo-search==8.1.1
    lxml==6.1.0
    httpx==0.28.1
    mcp>=1.9.4,<2.0.0

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    codeflow = codeflow_orch.cli:main
    codeflow-readonly-mcp = codeflow_orch.mcp_entrypoints:readonly_mcp_main

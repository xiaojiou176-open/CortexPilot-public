# Merge this into your OpenClaw config when you want the compatible local
# Agentcoder bundle plus the same read-only MCP server definition.

[plugins]
enabled = true

[plugins.load]
paths = [
  "__AGENTCODER_REPO_ROOT__/examples/coding-agents/plugin-bundles/agentcoder-coding-agent-bundle"
]

[plugins.entries.agentcoder-coding-agent-bundle]
enabled = true

[mcp.servers.agentcoder]
command = "bash"
args = ["__AGENTCODER_REPO_ROOT__/scripts/run_agentcoder_readonly_mcp.sh"]
cwd = "__AGENTCODER_REPO_ROOT__"

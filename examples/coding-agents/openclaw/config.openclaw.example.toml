# Merge this into your OpenClaw config when you want the compatible local
# Codeflow bundle plus the same read-only MCP server definition.

[plugins]
enabled = true

[plugins.load]
paths = [
  "__CODEFLOW_REPO_ROOT__/examples/coding-agents/plugin-bundles/codeflow-coding-agent-bundle"
]

[plugins.entries.codeflow-coding-agent-bundle]
enabled = true

[mcp.servers.codeflow]
command = "bash"
args = ["__CODEFLOW_REPO_ROOT__/scripts/run_codeflow_readonly_mcp.sh"]
cwd = "__CODEFLOW_REPO_ROOT__"

services:
  - type: web
    name: codeflow-api
    runtime: python
    plan: free
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r apps/orchestrator/requirements.txt && python -m pip install -e apps/orchestrator
    startCommand: PYTHONPATH=apps/orchestrator/src python -m codeflow_orch.cli serve --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: CODEFLOW_API_AUTH_REQUIRED
        value: "true"
      - key: CODEFLOW_API_ALLOWED_ORIGINS
        sync: false
      - key: CODEFLOW_API_TOKEN
        sync: false
      - key: CODEFLOW_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: CODEFLOW_RUNTIME_ROOT
        value: /var/data/codeflow
      - key: CODEFLOW_RUNS_ROOT
        value: /var/data/codeflow/runs
      - key: CODEFLOW_WORKTREE_ROOT
        value: /var/data/codeflow/worktrees
      - key: CODEFLOW_LOGS_ROOT
        value: /var/data/logs
    disk:
      name: codeflow-runtime
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: codeflow-dashboard
    runtime: node
    plan: free
    buildCommand: corepack enable pnpm && pnpm install --frozen-lockfile && pnpm --dir apps/dashboard build
    startCommand: corepack enable pnpm && pnpm --dir apps/dashboard exec next start -p $PORT -H 0.0.0.0
    envVars:
      - key: NEXT_PUBLIC_CODEFLOW_API_BASE
        sync: false
      - key: CODEFLOW_API_TOKEN
        sync: false
